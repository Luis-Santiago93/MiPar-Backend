[project]
name = "mipar-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<0.34",
    "sqlalchemy>=2.0,<3",
    "pg8000>=1.30,<2",
    "python-multipart>=0.0.9,<1",
    "PyJWT>=2.8,<3",
    "pwdlib[argon2]>=0.2,<1",
    "vercel>=0.2,<1",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.vercel]
entrypoint = "app.main:app"
